# Guinevere Prometheus Alert Rules — P8-014
# 9 alert rules covering SEV0 through SEV4 from ObsSpec Appendix B.
# Alert routing configured in P8-015 (alertmanager.yml).
# Neutral incident-command tone mandatory for all annotations.

groups:
  - name: guinevere-safety
    rules:
      # SEV0: Safe word bypass attempt detected
      - alert: GuinevereSafeWordBypassAttempt
        expr: increase(guinevere_safeword_events_total[5m]) > 0
        for: 0m
        labels:
          severity: "critical"
          sev_level: "SEV0"
        annotations:
          summary: "Safe word trigger detected"
          description: "A safe word trigger was fired, requiring immediate safety review."
          runbook: "docs/60-persona/60-PersonaSafetyPolicy_v1.0.md"

      # SEV0: Public ingress detected (non-Tailscale access to admin)
      - alert: GuineverePublicIngressDetected
        expr: guinevere_public_ingress_detected > 0
        for: 0m
        labels:
          severity: "critical"
          sev_level: "SEV0"
        annotations:
          summary: "Public ingress to admin endpoint detected"
          description: "Non-Tailscale traffic detected accessing admin endpoints."
          runbook: "docs/20-security/SecurityPolicy_v1.0.md"

  - name: guinevere-security
    rules:
      # SEV1: Log redaction failure
      - alert: GuinevereLogRedactionFailure
        expr: increase(guinevere_log_redaction_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: "high"
          sev_level: "SEV1"
        annotations:
          summary: "Log redaction failure detected"
          description: "Log redaction pipeline failed, potentially exposing sensitive data."

      # SEV1: Secret access outside startup
      - alert: GuinevereSecretAccessOutsideStartup
        expr: increase(guinevere_secret_access_total{phase!="startup"}[30m]) > 0
        for: 5m
        labels:
          severity: "high"
          sev_level: "SEV1"
        annotations:
          summary: "Secret accessed outside startup phase"
          description: "A secret decryption operation occurred outside the startup phase."

      # SEV1: Critical service down
      - alert: GuinevereCriticalServiceDown
        expr: up{job=~"fastapi|postgresql|redis"} == 0
        for: 2m
        labels:
          severity: "high"
          sev_level: "SEV1"
        annotations:
          summary: "Critical service {{ $labels.job }} is down"
          description: "A critical Guinevere service has been unreachable for 2 minutes."

  - name: guinevere-operations
    rules:
      # SEV2: Non-critical service down
      - alert: GuinevereNonCriticalServiceDown
        expr: up{job=~"node|loki|alertmanager"} == 0
        for: 5m
        labels:
          severity: "warning"
          sev_level: "SEV2"
        annotations:
          summary: "Non-critical service {{ $labels.job }} is down"

      # SEV2: Subagent file output missing sustained
      - alert: GuinevereSubagentFileOutputMissingSustained
        expr: increase(guinevere_subagent_file_missing_total[30m]) > 5
        for: 10m
        labels:
          severity: "warning"
          sev_level: "SEV2"
        annotations:
          summary: "Sustained subagent file output missing"

      # SEV2: LLM cost spike
      - alert: GuinevereLLMCostSpike
        expr: rate(guinevere_llm_cost_usd_total[1h]) > 0.50
        for: 15m
        labels:
          severity: "warning"
          sev_level: "SEV2"
        annotations:
          summary: "LLM cost spike detected — greater than $0.50/hour"

  - name: guinevere-finops
    rules:
      # SEV3: Restore drill overdue
      - alert: GuinevereRestoreDrillOverdue
        expr: time() - guinevere_backup_last_restore_drill_timestamp > 604800
        for: 1h
        labels:
          severity: "info"
          sev_level: "SEV3"
        annotations:
          summary: "Restore drill overdue (greater than 7 days)"

      # SEV3: LLM cost spike warning
      - alert: GuinevereLLMCostSpikeWarning
        expr: rate(guinevere_llm_cost_usd_total[1h]) > 0.25
        for: 15m
        labels:
          severity: "info"
          sev_level: "SEV3"
        annotations:
          summary: "LLM cost trend warning — greater than $0.25/hour"

  # ──────────────────────────────────────────────────────
  # Hermes gateway alert group — ADR-035 Phase 7b
  # Uses available hermes_llm_* metrics from Phase 6 plus
  # planned hermes_safety_*, hermes_memory_*, hermes_rate_limit_*
  # where noted as pending instrumentation.
  # ──────────────────────────────────────────────────────
  - name: guinevere-hermes
    rules:
      # SEV1: Hermes gateway down — critical routing path
      - alert: GuinevereHermesGatewayDown
        expr: up{job="hermes"} == 0
        for: 2m
        labels:
          severity: "high"
          sev_level: "SEV1"
        annotations:
          summary: "Hermes gateway is down"
          description: "The Hermes metrics endpoint at host.docker.internal:9191 has been unreachable for 2 minutes. LLM routing, safety checks, and gateway functions are unavailable."
          runbook: "docs/40-operations/runbooks/hermes-gateway-down.md"

      # SEV2: Hermes LLM latency elevated
      - alert: GuinevereHermesLatencyHigh
        expr: histogram_quantile(0.95, rate(hermes_llm_latency_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: "warning"
          sev_level: "SEV2"
        annotations:
          summary: "Hermes LLM latency high (p95 > 5s)"
          description: "95th percentile Hermes LLM request latency exceeds 5 seconds over the last 5 minutes. May indicate congestion or model provider degradation."
          runbook: "docs/40-operations/runbooks/hermes-gateway-down.md"

      # SEV2: Safety blocks spike — sudden increase in safety intercepts
      - alert: GuinevereHermesSafetyBlocksSpike
        expr: rate(hermes_safety_blocks_total[5m]) > 10
        for: 5m
        labels:
          severity: "warning"
          sev_level: "SEV2"
        annotations:
          summary: "Hermes safety blocks spike (> 10/min)"
          description: "Hermes safety plugin intercepted more than 10 requests in 5 minutes. Possible prompt injection attempt or policy misconfiguration."
          runbook: "docs/40-operations/runbooks/hermes-safety-spike.md"

      # SEV2: Budget near configured cap
      - alert: GuinevereHermesBudgetNearCap
        expr: hermes_llm_cost_usd_total > 24
        for: 15m
        labels:
          severity: "warning"
          sev_level: "SEV2"
        annotations:
          summary: "Hermes LLM budget near cap (> $24 — 80% of $30/month)"
          description: "Cumulative Hermes LLM cost exceeds $24 (80% of the $30/month ADR-035 cap). Review daily budget allocation and model routing configuration."
          runbook: "docs/40-operations/runbooks/hermes-cost-anomaly.md"

      # SEV3: Memory recall latency — pending Hermes-native instrumentation
      # Current metric is a placeholder; hermes_memory_recall_latency_seconds
      # will be exported once Hermes-native metrics are instrumented in Phase 7c.
      - alert: GuinevereHermesMemoryRecallLatency
        expr: rate(hermes_llm_latency_seconds_sum[5m]) / rate(hermes_llm_latency_seconds_count[5m]) > 10
        for: 10m
        labels:
          severity: "info"
          sev_level: "SEV3"
        annotations:
          summary: "Hermes memory recall latency elevated"
          description: "Average LLM request latency exceeds 10 seconds. May indicate memory recall pipeline congestion. Note: Hermes-native hermes_memory_recall_latency_seconds metric pending instrumentation (Phase 7c)."
          runbook: "docs/40-operations/runbooks/hermes-gateway-down.md"

      # SEV3: Model calls anomaly — pending per-model breakdown instrumentation
      # Uses aggregate hermes_llm_calls_total; per-model hermes_model_calls_total
      # will be exported once Hermes-native metrics are instrumented in Phase 7c.
      - alert: GuinevereHermesModelCallsAnomaly
        expr: rate(hermes_llm_calls_total[5m]) > 100
        for: 10m
        labels:
          severity: "info"
          sev_level: "SEV3"
        annotations:
          summary: "Hermes model call rate anomaly (> 100/min)"
          description: "Hermes LLM call rate exceeds 100 calls per minute over 5 minutes. Investigate for runaway agent loops or abnormal traffic. Note: Per-model hermes_model_calls_total metric pending instrumentation (Phase 7c)."
          runbook: "docs/40-operations/runbooks/hermes-cost-anomaly.md"
