# Guinevere Promtail Configuration — P8-010
# CRITICAL: Use Promtail 3.5.8 (3.6.0+ drops journald support — upstream issue 19911).
# Three scrape jobs: systemd journal, Docker containers, /var/log files.
# Pipeline stages parse JSON structured logs from guinevere services.
# ObsSpec §4: Loki labels must be bounded (service, component, environment, level, event_category).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Job 1: Systemd journal — captures all guinevere-* service logs
  - job_name: journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
        environment: production
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: "unit"
      - source_labels: ["__journal__hostname"]
        target_label: "hostname"
      - source_labels: ["__journal__systemd_unit"]
        regex: "guinevere-(.+)\\.service"
        target_label: "service"

  # Job 2: Docker container logs — monitoring stack containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - replacement: "docker"
        target_label: "environment"

  # Job 3: /var/log files — application logs and system logs
  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log
    pipeline_stages:
      - match:
          selector: '{filename="/var/log/guinevere*.log"}'
          stages:
            - json:
                expressions:
                  level: level
                  service: service
                  component: component
                  event_type: event_type
            - labels:
                level:
                service:
                component:
                event_type:
