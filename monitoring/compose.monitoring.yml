# Guinevere Monitoring Stack — Docker Compose
# P8-001: Master compose with ALL 8 services
# ALL ports bound to 127.0.0.1 ONLY (Tailscale-only access per ADR-017)
# Network: guinevere-net (external, bridge, 172.28.0.0/16)

services:
  prometheus:
    container_name: guinevere-prometheus
    image: prom/prometheus:v3.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - /home/guinevere/data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=15GB"
      - "--web.enable-lifecycle"
    networks:
      - guinevere-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  alertmanager:
    container_name: guinevere-alertmanager
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - guinevere-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    container_name: guinevere-grafana
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /home/guinevere/data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
    networks:
      - guinevere-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  loki:
    container_name: guinevere-loki
    image: grafana/loki:3.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - /home/guinevere/data/loki:/loki
    command:
      - "-config.file=/etc/loki/local-config.yml"
    networks:
      - guinevere-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  promtail:
    container_name: guinevere-promtail
    image: grafana/promtail:3.5.8  # CRITICAL: 3.6.0+ drops journald support (Issue #19911)
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log:/var/log:ro
    pid: host
    command:
      - "-config.file=/etc/promtail/config.yml"
    networks:
      - guinevere-net

  node-exporter:
    container_name: guinevere-node-exporter
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./node-exporter/textfile:/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.systemd"
      - "--collector.textfile.directory=/textfile"
    networks:
      - guinevere-net

  postgres-exporter:
    container_name: guinevere-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres_exporter:${PG_EXPORTER_PASSWORD}@host.docker.internal:5433/guinevere?sslmode=disable
      - PG_EXPORTER_AUTO_DISCOVER_DATABASES=true
    networks:
      - guinevere-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis-exporter:
    container_name: guinevere-redis-exporter
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      - REDIS_ADDR=redis://host.docker.internal:6380
      - REDIS_USER=exporter
      - REDIS_PASSWORD=${REDIS_EXPORTER_PASSWORD}
      - REDIS_EXPORTER_INCLUDE_SYSTEM_METRICS=true
    networks:
      - guinevere-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  guinevere-net:
    external: true
