# ==============================================================================
# Guinevere Hermes Agent — Gateway Configuration
# ==============================================================================
# File: ~/.hermes/config.yaml
# Deployed on VPS Ubuntu alongside ~/.hermes/.env
# See ADR-035 for full architectural context
# ==============================================================================

# ==============================================================================
# Discord Gateway Configuration
# ==============================================================================
discord:
  # Allowed users (comma-separated IDs in .env, mapped here as list)
  allowed_users:
    - "1146639950654214264"
  
  # Allowed channels — bot only responds in these channels
  allowed_channels:
    - "1510914600777023659"  # #guinevere-chat
  
  # Require @mention to trigger (false = respond to all messages in allowed channels)
  require_mention: false
  
  # Channels where @mention is NOT required (even if require_mention is true)
  free_response_channels:
    - "1510914600777023659"
  
  # Auto-thread for @mentions (false = respond inline in the channel)
  auto_thread: false
  
  # Session isolation: each user gets independent conversation in shared channels
  group_sessions_per_user: true
  
  # Text batching for Discord message limits
  text_batch_delay_seconds: 0.6
  text_batch_split_delay_seconds: 0.1
  
  # History backfill on @mention
  history_backfill: true

# ==============================================================================
# LLM Configuration (9Router proxy)
# ==============================================================================
llm:
  provider: custom
  model: gpt-5.5
  base_url: http://localhost:20128/v1
  api_key_env: NINEROUTER_API_KEY
  max_tokens: 16384
  temperature: 0.7
  api_max_retries: 3
  
  # Fallback configuration
  fallback:
    enabled: true
    model: deepseek-v4-flash
    strategy: sequential
  
  # Monthly budget tracking
  budget:
    monthly_limit: 30.00
    alert_threshold: 0.80
    block_threshold: 1.00
    currency: USD

# ==============================================================================
# Agent Runtime Configuration
# ==============================================================================
agent:
  # CRITICAL: 15 iterations for Discord Q&A (not 90 — too high for interactive use)
  max_iterations: 15
  
  # Agent identity
  name: Guinevere
  role: autonomous-ai-companion
  
  # Per-invocation settings
  new_instance_per_invocation: true  # AIAgent is NOT thread-safe

# ==============================================================================
# Memory Configuration
# ==============================================================================
memory:
  # Compression settings (aggressive safe)
  compression:
    enabled: true
    threshold: 0.7    # Start compressing at 70% token usage
    target: 0.2       # Target 20% after compression
    protect_last: 20  # Keep last 20 messages uncompressed
  
  # Session search (FTS5 for full-text search within sessions)
  session_search:
    enabled: true
    backend: fts5
  
  # File mirroring for external access
  mirrors:
    enabled: true
    sync_interval_messages: 5
  
  # External memory providers (all memory is PostgreSQL — no external)
  external:
    enabled: false

# ==============================================================================
# Safety Hooks Configuration
# ==============================================================================
# PRIMARY SAFETY LAYER: Python plugin (guinevere-safety) handles ALL 10 safety
# gates in-process via ctx.register_hook(). No shell hooks needed for:
#   - HARD STOP (G01) → pre_llm_call plugin hook
#   - Distress (G02) → pre_llm_call plugin hook
#   - Drift (G03) → post_llm_call plugin hook
#   - Recovery (G04) → pre_llm_call plugin hook
#   - Forbidden (G05) → transform_llm_output plugin hook
#   - Secrets (G06) → transform_llm_output plugin hook
#   - Yandere boundary (G07) → pre_llm_call plugin hook
#   - Yandere semantic (G08) → transform_llm_output plugin hook
#   - Auth matrix (G09) → pre_tool_call plugin hook
#
# SHELL HOOKS (defense-in-depth only): These complement the Python plugin
# for gates where the plugin's enforcement is deferred or observational-only.
# Hermes v0.15.2 requires each hook event value to be a LIST of hook specs.
# Valid events: pre_llm_call, post_llm_call, pre_tool_call, post_tool_call,
#   transform_llm_output, on_session_start, pre_gateway_dispatch,
#   pre_api_request, post_api_request, pre_approval_request,
#   post_approval_response, on_session_end, on_session_finalize,
#   on_session_reset, subagent_stop, transform_terminal_output,
#   transform_tool_result

hooks:
  # Consent gate — defense-in-depth for G10.
  # Plugin pre_tool_call has consent DEFERRED (needs Redis+SQLAlchemy in-process).
  # This shell hook runs consent_gate.py which does real Redis+PG consent checks.
  pre_tool_call:
    - event: pre_tool_call
      command: "python3 ~/.hermes/hooks/consent_gate.py"
      timeout_ms: 200
      on_failure: block
      priority: 90

  # DNR filter — defense-in-depth on tool results.
  # Plugin post_tool_call is observational-only (logs tool usage).
  # This shell hook runs dnr_filter.py which blocks tool results
  # containing do-not-respond patterns.
  post_tool_call:
    - event: post_tool_call
      command: "python3 ~/.hermes/hooks/dnr_filter.py"
      timeout_ms: 50
      on_failure: block
      priority: 70

# ==============================================================================
# MCP Server Configuration
# ==============================================================================
mcp_servers:
  # Web search and fetch tools
  web:
    enabled: true
    tools:
      - brave_search
      - exa_search
      - fetch_url
      - websearch
  
  # Filesystem access — restricted to guinevere repo root
  filesystem:
    enabled: true
    root_path: /home/guinevere/code/guinevere
    allowed_paths:
      - /home/guinevere/code/guinevere
    blocked_paths:
      - /etc
      - /root
      - /home/guinevere/.ssh
  
  # Terminal/Shell — whitelist-only commands
  terminal:
    enabled: true
    allowed_commands:
      - "ls,cat,head,tail,grep,find,wc,sort,uniq"
      - "python,pip,pytest"
      - "git,gh"
    blocked_commands:
      - "rm,dd,mkfs,shutdown,reboot,poweroff"
      - "iptables,ufw,systemctl"
    timeout_seconds: 30
  
  # Git operations — blocked: force-push, hard-reset
  git:
    enabled: true
    allowed_operations:
      - status
      - diff
      - log
      - branch
      - checkout
      - add
      - commit
      - push
      - pull
    blocked_operations:
      - "push --force"
      - "reset --hard"
      - "clean -fd"
  
  # HTTP fetch — 30s timeout, 10MB max
  fetch:
    enabled: true
    timeout_seconds: 30
    max_response_size_mb: 10

# ==============================================================================
# Cron Jobs — Rituals + System Maintenance
# ==============================================================================
cron:
  # === System Health & Maintenance ===
  - name: daily_health_check
    schedule: "0 6 * * *"
    command: "hermes doctor --report"
    enabled: true
  
  - name: weekly_backup
    schedule: "0 2 * * 0"
    command: "hermes backup --full --destination idcloudhost"
    enabled: true
  
  - name: monthly_security_scan
    schedule: "0 3 1 * *"
    command: "hermes security --report"
    enabled: true
  
  # === Persona Rituals (5 daily check-ins) ===
  - name: ritual_morning
    schedule: "0 8 * * *"
    command: "hermes plugin trigger guinevere_safety ritual morning"
    enabled: true
  
  - name: ritual_midday
    schedule: "0 12 * * *"
    command: "hermes plugin trigger guinevere_safety ritual midday"
    enabled: true
  
  - name: ritual_afternoon
    schedule: "0 16 * * *"
    command: "hermes plugin trigger guinevere_safety ritual afternoon"
    enabled: true
  
  - name: ritual_evening
    schedule: "0 20 * * *"
    command: "hermes plugin trigger guinevere_safety ritual evening"
    enabled: true
  
  - name: ritual_midnight
    schedule: "0 0 * * *"
    command: "hermes plugin trigger guinevere_safety ritual midnight"
    enabled: true

# ==============================================================================
# Observability
# ==============================================================================
observability:
  prometheus:
    enabled: true
    metrics_port: 9191
  
  logging:
    level: info
    format: json
    output: both  # stdout + loki
  
  insights:
    enabled: true
    cost_tracking: true
    latency_tracking: true

# ==============================================================================
# Auth Matrix — Tool-level Authorization
# ==============================================================================
# 4-Level Auth: READ_AUTO | WRITE_NOTIFY | DESTRUCTIVE_APPROVAL | FORBIDDEN
auth_matrix:
  web:
    brave_search: READ_AUTO
    exa_search: READ_AUTO
    websearch: READ_AUTO
    fetch: READ_AUTO
  
  filesystem:
    read: READ_AUTO
    write: WRITE_NOTIFY
    delete: DESTRUCTIVE_APPROVAL
    create_directory: WRITE_NOTIFY
  
  terminal:
    read_commands: READ_AUTO
    write_commands: WRITE_NOTIFY
    destructive_commands: DESTRUCTIVE_APPROVAL
    forbidden_commands: FORBIDDEN
  
  git:
    read: READ_AUTO
    write: WRITE_NOTIFY
    destructive: DESTRUCTIVE_APPROVAL
  
  fetch:
    get: READ_AUTO
    post: WRITE_NOTIFY
    upload: DESTRUCTIVE_APPROVAL

# ==============================================================================
# Approval Webhook (for DESTRUCTIVE_APPROVAL operations)
# ==============================================================================
approval:
  discord_webhook_url_env: DISCORD_APPROVAL_WEBHOOK
  timeout_ms: 300000  # 5 minutes
  retry_count: 2
  retry_delay_ms: 30000
  fallback_on_timeout: deny  # FAIL-CLOSED: timeout = deny

# ==============================================================================
# Audit Configuration
# ==============================================================================
audit:
  log_all_destructive: true
  log_all_forbidden_attempts: true
  log_write_notify: false
  retention_days: 90
  alert_on_forbidden_attempt: true