[project]
name = "guinevere"
version = "0.1.0"
description = "Guinevere AI Companion - Autonomous Agent System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.30",
    "alembic>=1",
    "redis>=5",
    "httpx>=0.28",
    "python-dotenv>=1",
    "apscheduler>=3",
    "sentry-sdk[fastapi]>=2",
    "prometheus-client>=0.21",
    "structlog>=24",
    "aiohttp>=3",
    "cryptography>=44",
    "discord.py>=2.4",
    "tenacity>=9",
    "websockets>=13",
    "typer>=0.15",
    "rich>=14",
    "pydantic-settings>=2",
    "passlib[bcrypt]>=1.7",
    "setuptools>=75",
    "hermes-agent>=0.15",
    "markdownify>=0.14",
    "mcp>=1.0",
    "sentence-transformers>=5.5",
    "scipy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]